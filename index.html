<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>대기전력 계산기</title>

  <style>
    body {
      margin: 0;
      font-family: "맑은 고딕", Arial, sans-serif;
      background-color: #f5f7fa;
      color: #333;
    }

    header {
      background-color: #4a90e2;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }

    nav {
      background-color: white;
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    nav button {
      border: none;
      background-color: #e9f2ff;
      padding: 12px 20px;
      border-radius: 20px;
      cursor: pointer;
    }

    nav button.active {
      background-color: #4a90e2;
      color: white;
    }

    section {
      display: none;
      max-width: 900px;
      margin: 30px auto;
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    section.active {
      display: block;
    }

    input {
      padding: 10px;
      width: 200px;
      margin: 10px 0;
      font-size: 16px;
    }

    button.calc {
      padding: 10px 20px;
      background-color: #4a90e2;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      background: #f0f6ff;
      padding: 15px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>대기전력 계산기</h1>
  <p>전자제품의 대기전력으로 전기요금을 계산해보세요</p>
</header>

<nav>
  <button class="tab-button active" onclick="showTab('calc')">계산기</button>
  <button class="tab-button" onclick="showTab('info')">설명</button>
</nav>

<!-- 계산기 -->
<section id="calc" class="active">
  <h2>대기전력 입력</h2>

  <p>대기전력 (W)를 입력하세요</p>
  <input type="number" id="power" placeholder="예: 5">

  <p>전기요금 (1kWh당 원)</p>
  <input type="number" id="price" placeholder="예: 120">

  <br>
  <button class="calc" onclick="calculate()">계산하기</button>

  <div class="result" id="result"></div>
</section>

<!-- 설명 -->
<section id="info">
  <h2>대기전력이란?</h2>
  <p>
    대기전력은 전자제품을 사용하지 않아도 전원이 연결되어 있을 때 소비되는 전력입니다.
  </p>
  <ul>
    <li>TV, 컴퓨터, 충전기 등에서 발생</li>
    <li>24시간 계속 소비됨</li>
    <li>전기요금 증가의 원인</li>
  </ul>
</section>

<script>
function showTab(tabId) {
  const sections = document.querySelectorAll("section");
  const buttons = document.querySelectorAll(".tab-button");

  sections.forEach(section => section.classList.remove("active"));
  buttons.forEach(button => button.classList.remove("active"));

  document.getElementById(tabId).classList.add("active");
  event.target.classList.add("active");
}

function calculate() {
  const power = document.getElementById("power").value;
  const price = document.getElementById("price").value;

  if (!power || !price) {
    alert("값을 입력하세요!");
    return;
  }

  // 하루 전력 사용량 (kWh)
  const dailyEnergy = (power * 24) / 1000;

  // 하루 요금
  const dailyCost = dailyEnergy * price;

  // 한달 (30일)
  const monthlyCost = dailyCost * 30;

  document.getElementById("result").innerHTML =
    "하루 전력 사용량: " + dailyEnergy.toFixed(3) + " kWh<br>" +
    "하루 전기요금: " + dailyCost.toFixed(1) + " 원<br>" +
    "한달 전기요금: " + monthlyCost.toFixed(0) + " 원";
}
</script>

</body>
</html>
